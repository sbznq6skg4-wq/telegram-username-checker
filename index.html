<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1020">
<title>Username Baholovchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1020;
    --panel: #161a30;
    --line: #2a3054;
    --text: #eef1ff;
    --muted: #8f97c2;
    --tg: #2aabee;
    --good: #46d39a;
    --bad: #ff6b7a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(42,171,238,.22), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(120,90,255,.18), transparent 60%),
      var(--bg);
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 460px; }
  h1 { font-size: clamp(1.9rem, 8vw, 2.5rem); font-weight: 800; line-height: 1.1; margin: 28px 0 10px; letter-spacing: -.02em; }
  .sub { color: var(--muted); line-height: 1.5; margin-bottom: 24px; }
  .box {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 20px; padding: 18px;
  }
  .field {
    display: flex; align-items: center; gap: 6px;
    background: #0f1226; border: 1.5px solid var(--line);
    border-radius: 14px; padding: 0 14px; transition: border-color .2s;
  }
  .field:focus-within { border-color: var(--tg); }
  .field span { color: var(--tg); font-weight: 800; font-size: 1.2rem; }
  input {
    flex: 1; min-width: 0; background: none; border: 0; outline: 0;
    color: var(--text); font: inherit; font-size: 1.1rem; padding: 15px 0;
  }
  input::placeholder { color: #566089; }
  button.go {
    width: 100%; margin-top: 12px; border: 0; cursor: pointer;
    background: var(--tg); color: #04121c; font: inherit; font-weight: 800;
    font-size: 1.05rem; padding: 15px; border-radius: 14px;
    transition: transform .12s, opacity .2s;
  }
  button.go:active { transform: scale(.98); }
  button.go:disabled { opacity: .6; cursor: wait; }
  button:focus-visible, input:focus-visible, .chip:focus-visible { outline: 2px solid var(--tg); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    background: none; color: var(--muted); border: 1px solid var(--line);
    border-radius: 99px; padding: 7px 13px; font: inherit; font-size: .9rem; cursor: pointer;
  }
  .chip:hover { color: var(--text); border-color: var(--muted); }
  .error { color: var(--bad); margin-top: 12px; line-height: 1.45; font-size: .95rem; min-height: 0; }
  #result { display: none; margin-top: 18px; text-align: center; }
  #result.show { display: block; }
  .ring { position: relative; width: 190px; height: 190px; margin: 4px auto 8px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 12; stroke-linecap: round; }
  .ring .track { stroke: #232849; }
  .ring .bar { stroke: var(--good); stroke-dasharray: 471.24; stroke-dashoffset: 471.24; transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1), stroke .4s; }
  .num { position: absolute; inset: 0; display: grid; place-content: center; }
  .num b { font-size: 3.4rem; font-weight: 800; line-height: 1; }
  .num small { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .who { color: var(--muted); word-break: break-all; }
  .title { font-size: 1.5rem; font-weight: 800; margin: 6px 0 8px; }
  .joke { color: #c9cff0; line-height: 1.55; }
  ul { list-style: none; padding: 0; margin: 18px 0 0; text-align: left; border-top: 1px solid var(--line); }
  li { display: flex; justify-content: space-between; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); font-size: .95rem; }
  li em { font-style: normal; font-weight: 800; }
  li .plus { color: var(--good); } li .minus { color: var(--bad); }
  .share { margin-top: 16px; background: none; border: 1px solid var(--line); color: var(--text); padding: 11px 18px; border-radius: 12px; font: inherit; cursor: pointer; }
  footer { text-align: center; color: #566089; font-size: .8rem; margin-top: 22px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Username'ingiz necha ball?</h1>
  <p class="sub">Telegram username'ingizni yozing. Uzunligi, so'zlari va ko'rinishiga qarab 100 ballik baho beramiz.</p>

  <div class="box">
    <div class="field">
      <span>@</span>
      <input id="u" type="text" placeholder="ism" maxlength="40" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" aria-label="Telegram username">
    </div>
    <button class="go" id="btn" type="button">Baholash</button>
    <div class="error" id="err" role="alert"></div>
    <div class="chips">
      <button class="chip" type="button" data-u="sherzod">@sherzod</button>
      <button class="chip" type="button" data-u="cool_king_uz">@cool_king_uz</button>
      <button class="chip" type="button" data-u="user_88_2007">@user_88_2007</button>
    </div>
  </div>

  <section id="result" class="box" aria-live="polite">
    <div class="ring">
      <svg viewBox="0 0 170 170"><circle class="track" cx="85" cy="85" r="75"/><circle class="bar" id="bar" cx="85" cy="85" r="75"/></svg>
      <div class="num"><b id="score">0</b><small>/ 100</small></div>
    </div>
    <div class="who" id="who"></div>
    <div class="title" id="title"></div>
    <p class="joke" id="joke"></p>
    <ul id="list"></ul>
    <button class="share" id="share" type="button">Natijani nusxalash</button>
  </section>

  <footer>Hazil uchun yasalgan, jiddiy qabul qilmang 🙂</footer>
</main>

<script>
(function () {
  var input = document.getElementById("u");
  var btn = document.getElementById("btn");
  var err = document.getElementById("err");
  var result = document.getElementById("result");
  var bar = document.getElementById("bar");
  var scoreEl = document.getElementById("score");
  var CIRC = 471.24;
  var last = null;
  var timer = null;

  function setColor(score) {
    bar.style.stroke = "hsl(" + Math.round(score * 1.3) + ", 75%, 58%)";
  }

  function countUp(target) {
    clearInterval(timer);
    var cur = 0;
    var step = Math.max(1, Math.round(target / 40));
    timer = setInterval(function () {
      cur = Math.min(target, cur + step);
      scoreEl.textContent = cur;
      if (cur >= target) clearInterval(timer);
    }, 25);
  }

  function show(d) {
    last = d;
    document.getElementById("who").textContent = "@" + d.username;
    document.getElementById("title").textContent = d.title;
    document.getElementById("joke").textContent = d.joke;

    var list = document.getElementById("list");
    list.innerHTML = "";
    d.details.forEach(function (x) {
      var li = document.createElement("li");
      var a = document.createElement("span");
      a.textContent = x.label;
      var b = document.createElement("em");
      b.textContent = (x.delta > 0 ? "+" : "") + x.delta;
      b.className = x.delta > 0 ? "plus" : "minus";
      li.appendChild(a); li.appendChild(b);
      list.appendChild(li);
    });

    result.classList.add("show");
    bar.style.strokeDashoffset = CIRC;
    setColor(d.score);
    scoreEl.textContent = "0";
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        bar.style.strokeDashoffset = CIRC * (1 - d.score / 100);
        countUp(d.score);
      });
    });
    result.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function run() {
    err.textContent = "";
    var value = input.value.trim();
    if (!value) { err.textContent = "Username kiriting, masalan: @ism"; input.focus(); return; }
    btn.disabled = true;
    btn.textContent = "Tahlil qilinmoqda...";

    fetch("/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: value })
    })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) { err.textContent = res.j.error || "Xatolik yuz berdi."; result.classList.remove("show"); }
      else show(res.j);
    })
    .catch(function () { err.textContent = "Server bilan aloqa yo'q. Qayta urinib ko'ring."; })
    .then(function () { btn.disabled = false; btn.textContent = "Baholash"; });
  }

  btn.addEventListener("click", run);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
  document.querySelectorAll(".chip").forEach(function (c) {
    c.addEventListener("click", function () { input.value = c.dataset.u; run(); });
  });
  document.getElementById("share").addEventListener("click", function (e) {
    if (!last) return;
    var text = "@" + last.username + " — " + last.score + "/100 " + last.title;
    var b = e.currentTarget;
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(function () { b.textContent = "Nusxalandi ✓"; })
      .catch(function () { b.textContent = text; })
      .then(function () { setTimeout(function () { b.textContent = "Natijani nusxalash"; }, 2500); });
  });
})();
</script>
</body>
</html>
